<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Secure Mail Portal</title>
<style>
  :root{color-scheme:light;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  body{margin:0;background:#f5f7fb;color:#172033;min-height:100vh;display:grid;place-items:center}
  main{box-sizing:border-box;width:min(92vw,440px);padding:32px;border:1px solid #e1e5ed;background:white;border-radius:16px;box-shadow:0 8px 30px #0b193010}
  .status{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#277449;font-weight:700}
  h1{font-size:26px;margin:12px 0} p{line-height:1.6;color:#4d596c} strong{overflow-wrap:anywhere}
  .note{border-top:1px solid #edf0f5;margin-top:24px;padding-top:20px;font-size:14px}
</style>
</head>
<body>
<main>
  <div class="status">✓ Secure session</div>
  <h1>Welcome to your portal</h1>
  <p>You are signed in as <strong>${escapeHTML(email)}</strong>.</p>
  <p>Your identity was verified using Cloudflare Access.</p>
  <p class="note">Mailbox access is not enabled. Connect an authorized email provider using its supported sign-in flow and API.</p>
</main>
</body>
</html>
